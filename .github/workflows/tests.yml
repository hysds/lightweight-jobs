name: tests

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The suite stubs the hysds runtime, so only pytest and the libraries
      # retry.py and utils.py import directly are needed.
      - run: pip install -r requirements-test.txt backoff redis
      - run: python -m pytest tests/ -v
